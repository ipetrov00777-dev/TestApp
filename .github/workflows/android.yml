
name: Build SmartBox Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/assets/index.html'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets

          test -s app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartBox"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'org.test.smartbox'
              compileSdk 35

              defaultConfig {
                  applicationId 'org.test.smartbox'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          mkdir -p app/src/main/java/org/test/smartbox

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="SmartBox"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/org/test/smartbox/MainActivity.kt <<'EOF'
          package org.test.smartbox

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.*
          import android.content.Intent
          import android.net.Uri
          import android.view.ViewGroup
          import android.widget.FrameLayout

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  webView.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.javaScriptCanOpenWindowsAutomatically = true
                  webView.settings.setSupportMultipleWindows(false)

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          callback: ValueCallback<Array<Uri>>?,
                          params: FileChooserParams?
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback

                          val intent = params?.createIntent()
                              ?: Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = "*/*"
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }

                          return try {
                              startActivityForResult(intent, 1001)
                              true
                          } catch (e: Exception) {
                              fileCallback?.onReceiveValue(null)
                              fileCallback = null
                              false
                          }
                      }
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Android API")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001) {
                      val result = if (resultCode == Activity.RESULT_OK) {
                          WebChromeClient.FileChooserParams.parseResult(resultCode, data)
                      } else null
                      fileCallback?.onReceiveValue(result)
                      fileCallback = null
                  }
              }

              @Deprecated("Deprecated in Android API")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBox-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
